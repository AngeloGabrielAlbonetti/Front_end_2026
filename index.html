<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabalhos-front-end</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css.css">
</head>

<body>

<canvas id="fundo" aria-hidden="true"></canvas>
<div id="brilho" aria-hidden="true"></div>

<header>
    <div class="navegação">
        <nav>
            <div class="avatar">
                <img src="https://angelogabrielalbonetti.github.io/Front_end_2026/tr2/1745601131792.jpg" alt="Foto de Angelo Gabriel Albonetti">
            </div>
            <samp>
                Aluno: <b>Angelo Gabriel Albonetti</b><br>
                RA: 250543483-2
            </samp>
        </nav>
    </div>

    <div class="hero">
        <h1>Meus Trabalhos front-end</h1>
        <p class="digitando" id="digitando"></p>
    </div>
</header>

<main>
    <div class="ferramentas">
        <div class="busca">
            <input type="search" id="busca" placeholder="Buscar trabalho pelo número" aria-label="Buscar trabalho">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </div>
        <button class="botao" id="ordem" type="button">Ordem: crescente</button>
        <div class="contador" id="contador" aria-live="polite"></div>
    </div>

    <div class="tr" id="trabalhos"></div>
</main>

<button id="topo" type="button" aria-label="Voltar ao topo">↑</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

<script src="js.js"></script>

</body>
</html>
